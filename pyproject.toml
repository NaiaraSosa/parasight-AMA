[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parasight-AMA"
version = "0.1.0"
description = "Segment and count parasites (amastigotes) in microsopy images"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "typer>=0.12",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "pydantic>=2.0",
  "pillow>=10.0",
  "matplotlib>=3.8",
  "numpy>=1.26,<2",
  "scipy>=1.11",
  "tifffile>=2024.0.0",
  "czifile>=2019.7.2",
  "cellpose>=3.0",
  "stardist>=0.9.1",
  "csbdeep>=0.8.0",
  "tensorflow-cpu==2.15.*",
]

[project.scripts]
parasight = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "scripts*", "tests*"]
