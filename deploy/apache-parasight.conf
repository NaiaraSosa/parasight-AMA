# Apache reverse proxy for Parasight-AMA with HTTP basic auth.
# This file goes on the PROXY server (not on the app server); see DEPLOY.md, section 6.
#
#   sudo a2enmod ssl proxy proxy_http headers reqtimeout
#   sudo cp apache-parasight.conf /etc/apache2/sites-available/parasight.conf
#   sudo a2ensite parasight && sudo apachectl configtest && sudo systemctl reload apache2
#
# Replace APP_SERVER with the app server's address (the one set in APP_HOST there).
# The app needs its own host name or port: its pages use absolute links (/upload,
# /jobs/...), so it does not work under a sub-path such as https://host/parasight/.

<VirtualHost *:443>
    ServerName parasight.example.org

    SSLEngine on
    SSLCertificateFile    /etc/ssl/parasight/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/parasight/privkey.pem

    <Location "/">
        AuthType Basic
        AuthName "Parasight"
        AuthUserFile /etc/apache2/parasight.htpasswd
        Require valid-user
    </Location>

    ProxyPreserveHost On
    ProxyPass        / http://APP_SERVER:8010/ timeout=3600
    ProxyPassReverse / http://APP_SERVER:8010/
    RequestHeader set X-Forwarded-Proto "https"

    # Large uploads: no size limit here (the app enforces MAX_UPLOAD_MB), and don't
    # drop slow clients. The default reqtimeout rules cut off slow multi-GB uploads.
    LimitRequestBody 0
    RequestReadTimeout header=20-40,MinRate=500 body=60,MinRate=1000
    ProxyTimeout 3600

    ErrorLog  ${APACHE_LOG_DIR}/parasight-error.log
    CustomLog ${APACHE_LOG_DIR}/parasight-access.log combined
</VirtualHost>
