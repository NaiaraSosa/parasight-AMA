# nginx reverse proxy for Parasight-AMA with HTTP basic auth (see DEPLOY.md, section 6).
# Install as /etc/nginx/conf.d/parasight.conf (or in sites-available) and adjust the
# server_name, port and certificate paths. The app must listen on 127.0.0.1 only
# (APP_HOST=127.0.0.1), otherwise port 8010 still lets people skip the login.
server {
    listen 8443 ssl;                       # or a server_name on 443 shared with other apps
    server_name parasight.example.org;
    ssl_certificate     /etc/ssl/parasight/fullchain.pem;
    ssl_certificate_key /etc/ssl/parasight/privkey.pem;

    auth_basic "Parasight";
    auth_basic_user_file /etc/nginx/parasight.htpasswd;

    client_max_body_size 20g;              # keep in step with MAX_UPLOAD_MB
    proxy_request_buffering off;           # stream uploads instead of buffering them in nginx
    proxy_read_timeout 300s;               # jobs run in the background; this only covers uploads/pages
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
