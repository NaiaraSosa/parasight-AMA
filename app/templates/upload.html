<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archivo subido</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <p class="eyebrow">Carga completa</p>
        <h1>Archivo recibido</h1>

        <div class="meta">
          {% include "_job_link.html" %}
          <p><span>Archivo</span> {{ filename }}</p>
        </div>

        <!----
        <form
          action="/preprocess/{{ job_id }}"
          method="post"
          class="stack run-form"
          data-progress-title="Revisando calidad"
          data-progress-text="Segmentando células para estimar qué imágenes del batch son usables."
        >
          <button type="submit" class="btn btn-primary">Revisar calidad del batch</button>
        </form>
        -->

        <form
          action="/process/{{ job_id }}"
          method="post"
          class="stack run-form"
          data-progress-title="Procesando imágenes"
          data-progress-text="Esto puede tardar unos minutos según el tamaño del archivo."
        >
          <button type="submit" class="btn btn-primary">Procesar segmentación</button>
        </form>

        <a href="/" class="btn btn-ghost">Volver al inicio</a>
      </section>
    </main>
    <div id="progress-overlay" class="progress-overlay" aria-live="polite" aria-hidden="true">
      <div class="progress-card">
        <div class="spinner" aria-hidden="true"></div>
        <h2 id="progress-title">Procesando imágenes</h2>
        <p id="progress-text">Esto puede tardar unos minutos según el tamaño del archivo.</p>
        <div class="progress-track">
          <div class="progress-bar"></div>
        </div>
      </div>
    </div>
    <script>
      const forms = document.querySelectorAll(".run-form");
      const overlay = document.getElementById("progress-overlay");
      const progressTitle = document.getElementById("progress-title");
      const progressText = document.getElementById("progress-text");

      forms.forEach((form) => {
        form.addEventListener("submit", () => {
          const button = form.querySelector("button");
          if (button) {
            button.disabled = true;
            button.textContent = "Procesando...";
          }
          progressTitle.textContent = form.dataset.progressTitle || "Procesando imágenes";
          progressText.textContent = form.dataset.progressText || "";
          overlay.classList.add("is-visible");
          overlay.setAttribute("aria-hidden", "false");
        });
      });
    </script>
  </body>
</html>
